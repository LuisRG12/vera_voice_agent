[project]
name = "vera"
version = "0.1.0"
description = "Agente de voz para seguimiento postoperatorio"
requires-python = ">=3.11"
# Un solo grupo de dependencias a propósito: un `uv sync` sin banderas deja la
# aplicación completamente funcional. Los extras opcionales son una trampa en un
# despliegue cronometrado —si quien lo instala olvida la bandera, el agente
# arranca a medias y el error que ve no dice por qué—.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # RAG local: embeddings ONNX (sin torch), BM25 y lectores de documento.
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Para PDFs cifrados: el corpus trae uno que sin esto no se puede abrir. Y la
    # consola recibe documentos del evaluador que no hemos visto, donde un PDF
    # protegido es un formato perfectamente normal.
    "cryptography>=42",
    # Modelo de lenguaje local y, más adelante, proveedores de voz: todo por
    # HTTP/WebSocket directo. Un SDK no aporta nada sobre una API local.
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Los prompts son contenido, no código: partirlos por ancho de línea cambiaría
# literalmente lo que el modelo lee. Se exceptúan solo los archivos que los
# contienen, no el proyecto entero.
"**/prompts.py" = ["E501"]
"evals/spike_modelo.py" = ["E501"]
